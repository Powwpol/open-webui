# Pulsai - Build depuis GitHub (clone local puis build)
# Source: https://github.com/Powwpol/open-webui

services:
  # ======================================
  # Pulsai Backend (Build depuis fichiers locaux après clone GitHub)
  # ======================================
  pulsai-backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USE_CUDA: "false"
        USE_OLLAMA: "false"
        USE_SLIM: "true"  # Slim par défaut pour build rapide
    image: pulsai/backend:github
    container_name: pulsai-backend-github
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - WEBUI_NAME=Pulsai
      - ENV=production
      
      # Database
      - DATABASE_URL=sqlite:///app/backend/data/webui.db
      
      # Redis
      - REDIS_URL=redis://pulsai-redis:6379/0
      
      # Ollama
      - OLLAMA_BASE_URL=http://pulsai-ollama:11434
      
      # MCP Configuration
      - MCP_CONFIG_PATH=/app/config/mcp-servers.yaml
      
      # Security
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:-change-me-secure-secret}
      
      # Features
      - ENABLE_SIGNUP=${ENABLE_SIGNUP:-true}
      - ENABLE_WEBHOOKS=true
      - ANONYMIZED_TELEMETRY=false
      
      # Logging
      - LOG_LEVEL=INFO
    
    volumes:
      - pulsai-data-github:/app/backend/data
      - ./config:/app/config:ro
    
    depends_on:
      pulsai-redis:
        condition: service_healthy
      pulsai-ollama:
        condition: service_started
    
    networks:
      - pulsai-network
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ======================================
  # Pulsai Redis (Cache & Sessions)
  # ======================================
  pulsai-redis:
    image: redis:7-alpine
    container_name: pulsai-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - pulsai-redis-data:/data
    networks:
      - pulsai-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ======================================
  # Pulsai Ollama (Local LLM Inference)
  # ======================================
  pulsai-ollama:
    image: ollama/ollama:latest
    container_name: pulsai-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - pulsai-ollama-data:/root/.ollama
    networks:
      - pulsai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # Uncomment for GPU support
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # ======================================
  # Pulsai MCP Server (Build depuis fichiers locaux)
  # ======================================
  pulsai-mcp:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    image: pulsai/mcp:github
    container_name: pulsai-mcp-github
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - LOG_LEVEL=INFO
      - PULSAI_BACKEND_URL=http://pulsai-backend:8080
    networks:
      - pulsai-network
    depends_on:
      pulsai-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

# ======================================
# Volumes
# ======================================
volumes:
  pulsai-data-github:
    name: pulsai-data-github
  pulsai-redis-data:
    name: pulsai-redis-data
  pulsai-ollama-data:
    name: pulsai-ollama-data

# ======================================
# Networks
# ======================================
networks:
  pulsai-network:
    name: pulsai-network-github
    driver: bridge

