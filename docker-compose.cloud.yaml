version: '3.8'

# PulsAI - Utilisation image depuis GitHub Container Registry
# Source: github.com/Powwpol/open-webui

services:
  # ======================================
  # Pulsai Backend (Image depuis ghcr.io)
  # ======================================
  pulsai-backend:
    image: ghcr.io/powwpol/open-webui:latest
    container_name: pulsai-backend-cloud
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - WEBUI_NAME=Pulsai
      - ENV=production
      
      # Database
      - DATABASE_URL=sqlite:///app/backend/data/webui.db
      
      # Redis
      - REDIS_URL=redis://pulsai-redis:6379/0
      
      # Ollama
      - OLLAMA_BASE_URL=http://pulsai-ollama:11434
      
      # Security
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:-change-me-secure-secret}
      
      # Features
      - ENABLE_SIGNUP=${ENABLE_SIGNUP:-true}
      - ENABLE_WEBHOOKS=true
      - ANONYMIZED_TELEMETRY=false
      
      # Logging
      - LOG_LEVEL=INFO
    
    volumes:
      - pulsai-data-cloud:/app/backend/data
      - ./config:/app/config:ro
    
    depends_on:
      pulsai-redis:
        condition: service_healthy
      pulsai-ollama:
        condition: service_started
    
    networks:
      - pulsai-network
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ======================================
  # Pulsai Redis (Cache & Sessions)
  # ======================================
  pulsai-redis:
    image: redis:7-alpine
    container_name: pulsai-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - pulsai-redis-data:/data
    networks:
      - pulsai-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ======================================
  # Pulsai Ollama (Local LLM Inference)
  # ======================================
  pulsai-ollama:
    image: ollama/ollama:latest
    container_name: pulsai-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - pulsai-ollama-data:/root/.ollama
    networks:
      - pulsai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # Uncomment for GPU support
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

# ======================================
# Volumes
# ======================================
volumes:
  pulsai-data-cloud:
    name: pulsai-data-cloud
  pulsai-redis-data:
    name: pulsai-redis-data
  pulsai-ollama-data:
    name: pulsai-ollama-data

# ======================================
# Networks
# ======================================
networks:
  pulsai-network:
    name: pulsai-network-cloud
    driver: bridge

