version: '3.8'

# Pulsai Local Build Docker Compose
# Build frontend et backend depuis fichiers locaux

services:
  # ======================================
  # Pulsai Backend (Build Local)
  # ======================================
  pulsai-backend:
    build:
      context: .
      dockerfile: docker/pulsai-backend.Dockerfile
      args:
        PYTHON_VERSION: "3.11"
        USE_SLIM: "false"  # false = avec embeddings, true = slim
    image: pulsai/backend:local
    container_name: pulsai-backend-local
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - PORT=8080
      - WEBUI_NAME=Pulsai
      - ENV=production
      - DATABASE_URL=sqlite:///app/backend/data/webui.db
      - REDIS_URL=redis://pulsai-redis:6379/0
      - OLLAMA_BASE_URL=http://pulsai-ollama:11434
      - MCP_CONFIG_PATH=/app/config/mcp-servers.yaml
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:-change-me-to-secure-key}
      - ENABLE_SIGNUP=${ENABLE_SIGNUP:-true}
      - ENABLE_WEBHOOKS=true
      - ANONYMIZED_TELEMETRY=false
      - LOG_LEVEL=INFO
    volumes:
      - pulsai-data:/app/backend/data
      - ./config:/app/config:ro
    depends_on:
      - pulsai-redis
      - pulsai-ollama
      - pulsai-mcp
    networks:
      - pulsai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ======================================
  # Pulsai Frontend (Build Local)
  # ======================================
  pulsai-frontend:
    build:
      context: .
      dockerfile: docker/pulsai-frontend.Dockerfile
      args:
        NODE_VERSION: "20"
    image: pulsai/frontend:local
    container_name: pulsai-frontend-local
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - pulsai-backend
    networks:
      - pulsai-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ======================================
  # Pulsai Redis (Cache & Sessions)
  # ======================================
  pulsai-redis:
    image: redis:7-alpine
    container_name: pulsai-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - pulsai-redis-data:/data
    networks:
      - pulsai-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ======================================
  # Pulsai Ollama (Local LLM Inference)
  # ======================================
  pulsai-ollama:
    image: ollama/ollama:latest
    container_name: pulsai-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - pulsai-ollama-data:/root/.ollama
    networks:
      - pulsai-network
    # Uncomment for GPU support
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # ======================================
  # Pulsai MCP Server (Build Local)
  # ======================================
  pulsai-mcp:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    image: pulsai/mcp:local
    container_name: pulsai-mcp
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - LOG_LEVEL=INFO
    networks:
      - pulsai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

# ======================================
# Volumes
# ======================================
volumes:
  pulsai-data:
    name: pulsai-data-local
  pulsai-redis-data:
    name: pulsai-redis-data-local
  pulsai-ollama-data:
    name: pulsai-ollama-data-local

# ======================================
# Networks
# ======================================
networks:
  pulsai-network:
    name: pulsai-network-local
    driver: bridge


