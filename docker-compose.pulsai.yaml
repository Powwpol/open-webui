version: '3.8'

# Pulsai Complete Docker Compose
# Includes: Frontend, Backend, Ollama, Redis, MCP Server

services:
  # ======================================
  # Pulsai Backend (FastAPI)
  # ======================================
  pulsai-backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USE_CUDA: "false"
        USE_OLLAMA: "false"
        USE_SLIM: "false"
    image: pulsai/backend:latest
    container_name: pulsai-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - WEBUI_NAME=Pulsai
      - ENV=production
      # Public base URL used for OAuth redirects and links
      - WEBUI_URL=http://localhost:8080
      
      # Database
      - DATABASE_URL=sqlite:///app/backend/data/webui.db
      
      # Redis
      - REDIS_URL=redis://pulsai-redis:6379/0
      
      # Ollama
      - OLLAMA_BASE_URL=http://pulsai-ollama:11434
      
      # MCP Configuration
      - MCP_CONFIG_PATH=/app/config/mcp-servers.yaml
      
      # Security
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:-change-me-to-a-secure-secret}
      # Cookie settings for local (HTTP) Docker usage
      - WEBUI_AUTH_COOKIE_SAME_SITE=${WEBUI_AUTH_COOKIE_SAME_SITE:-lax}
      - WEBUI_AUTH_COOKIE_SECURE=${WEBUI_AUTH_COOKIE_SECURE:-false}
      
      # Features
      - ENABLE_SIGNUP=${ENABLE_SIGNUP:-true}
      - ENABLE_WEBHOOKS=true
      - ANONYMIZED_TELEMETRY=false
      
      # Logging
      - LOG_LEVEL=INFO

      # ============================
      # OAuth / OIDC configuration
      # Enable ONE of the providers below by supplying values
      # Generic OIDC (Keycloak/Okta/Auth0/Azure Entra ID, etc.)
      - OPENID_PROVIDER_URL=${OPENID_PROVIDER_URL:-}
      - OAUTH_CLIENT_ID=${OAUTH_CLIENT_ID:-}
      - OAUTH_CLIENT_SECRET=${OAUTH_CLIENT_SECRET:-}
      - OAUTH_SCOPES=${OAUTH_SCOPES:-openid email profile}
      - OAUTH_PROVIDER_NAME=${OAUTH_PROVIDER_NAME:-SSO}
      # Optional: restrict allowed email domains (comma-separated). Use * to allow all
      - OAUTH_ALLOWED_DOMAINS=${OAUTH_ALLOWED_DOMAINS:-*}
      # Optional: allow creating users from OAuth
      - ENABLE_OAUTH_SIGNUP=${ENABLE_OAUTH_SIGNUP:-true}
      - OAUTH_MERGE_ACCOUNTS_BY_EMAIL=${OAUTH_MERGE_ACCOUNTS_BY_EMAIL:-false}

      # Google OAuth (optional)
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_OAUTH_SCOPE=${GOOGLE_OAUTH_SCOPE:-openid email profile}

      # Microsoft OAuth (optional)
      - MICROSOFT_CLIENT_ID=${MICROSOFT_CLIENT_ID:-}
      - MICROSOFT_CLIENT_SECRET=${MICROSOFT_CLIENT_SECRET:-}
      - MICROSOFT_CLIENT_TENANT_ID=${MICROSOFT_CLIENT_TENANT_ID:-}
      - MICROSOFT_OAUTH_SCOPE=${MICROSOFT_OAUTH_SCOPE:-openid email profile}

      # GitHub OAuth (optional)
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - GITHUB_CLIENT_SCOPE=${GITHUB_CLIENT_SCOPE:-user:email}
    
    volumes:
      - pulsai-data:/app/backend/data
      - ./config:/app/config:ro
    
    depends_on:
      - pulsai-redis
      - pulsai-ollama
      - pulsai-mcp
    
    networks:
      - pulsai-network
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ======================================
  # Pulsai Redis (Cache & Sessions)
  # ======================================
  pulsai-redis:
    image: redis:7-alpine
    container_name: pulsai-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - pulsai-redis-data:/data
    networks:
      - pulsai-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ======================================
  # Pulsai Ollama (Local LLM Inference)
  # ======================================
  pulsai-ollama:
    image: ollama/ollama:latest
    container_name: pulsai-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - pulsai-ollama-data:/root/.ollama
    networks:
      - pulsai-network
    # Uncomment for GPU support
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # ======================================
  # Pulsai MCP Server (Model Context Protocol)
  # ======================================
  pulsai-mcp:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    image: pulsai/mcp:latest
    container_name: pulsai-mcp
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - LOG_LEVEL=INFO
    networks:
      - pulsai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

# ======================================
# Volumes
# ======================================
volumes:
  pulsai-data:
    name: pulsai-data
  pulsai-redis-data:
    name: pulsai-redis-data
  pulsai-ollama-data:
    name: pulsai-ollama-data

# ======================================
# Networks
# ======================================
networks:
  pulsai-network:
    name: pulsai-network
    driver: bridge

