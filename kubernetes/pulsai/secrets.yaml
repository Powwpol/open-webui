apiVersion: v1
kind: Secret
metadata:
  name: pulsai-secrets
  namespace: pulsai
  labels:
    app: pulsai
type: Opaque
stringData:
  # IMPORTANT: Replace these values before deploying!
  # Generate secrets using: openssl rand -hex 32
  
  SECRET_KEY: "REPLACE_WITH_YOUR_SECRET_KEY"
  POSTGRES_PASSWORD: "REPLACE_WITH_YOUR_POSTGRES_PASSWORD"
  MCP_AUTH_TOKEN: "REPLACE_WITH_YOUR_MCP_TOKEN"
  
  # Optional API Keys
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  VLLM_API_KEY: ""
  
  # n8n Integration
  N8N_WEBHOOK_URL: ""
  
  # Session
  SESSION_SECRET: "REPLACE_WITH_YOUR_SESSION_SECRET"

---
