[tool.poetry]
name = "pulsai-mcp"
version = "1.0.0"
description = "Custom Pulsai MCP Server with recursive chat and model tools"
authors = ["Pulsai Team"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.35.0"}
pydantic = "^2.11.0"
mcp = "^1.14.1"
aiohttp = "^3.12.0"
pyyaml = "^6.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.24.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
pulsai-mcp = "pulsai_mcp.server:main"

